[project]
name = "linker"
version = "0.1.0"
description = "Gallery, links and API over the keiyoushi extension database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "markdown-it-py[linkify]>=4.3.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linker"]
